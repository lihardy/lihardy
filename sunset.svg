<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="850" height="220">
  <defs>
    <!-- Sunset Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1021" />
      <stop offset="35%" stop-color="#1e1b4b" />
      <stop offset="68%" stop-color="#7c2d12" />
      <stop offset="88%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Glowing Sun Gradient -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="55%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </radialGradient>

    <!-- Soft Sun Halo -->
    <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Water Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#431407" />
      <stop offset="40%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>

    <!-- Rounded Banner Clip -->
    <clipPath id="rounded">
      <rect width="850" height="220" rx="14" ry="14" />
    </clipPath>

    <!-- Horizon Clip for Sun -->
    <clipPath id="aboveHorizon">
      <rect x="0" y="0" width="850" height="168" />
    </clipPath>
  </defs>

  <style>
    .sun-group {
      animation: sunSet 10s ease-in-out infinite alternate;
    }
    .halo {
      animation: pulseHalo 5s ease-in-out infinite alternate;
      transform-origin: 425px 155px;
    }
    .star-1 { animation: twinkle 3.2s ease-in-out infinite; }
    .star-2 { animation: twinkle 4.5s ease-in-out 1.1s infinite; }
    .star-3 { animation: twinkle 3.8s ease-in-out 2.0s infinite; }
    .ripple-1 { animation: shimmer 4s ease-in-out infinite alternate; }
    .ripple-2 { animation: shimmer 5s ease-in-out 0.8s infinite alternate; }
    .ripple-3 { animation: shimmer 4.5s ease-in-out 1.5s infinite alternate; }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 54px;
      letter-spacing: -1.5px;
      fill: #ffffff;
      animation: fadeGlow 6s ease-in-out infinite alternate;
    }

    @keyframes sunSet {
      0% { transform: translateY(-10px); }
      100% { transform: translateY(14px); }
    }
    @keyframes pulseHalo {
      0% { opacity: 0.65; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.95; }
    }
    @keyframes shimmer {
      0% { opacity: 0.3; transform: translateX(-6px); }
      100% { opacity: 0.85; transform: translateX(6px); }
    }
    @keyframes fadeGlow {
      0% { opacity: 0.92; }
      100% { opacity: 1; }
    }
  </style>

  <g clip-path="url(#rounded)">
    <!-- Sky -->
    <rect width="850" height="170" fill="url(#skyGrad)" />

    <!-- Subtle Twilight Stars -->
    <circle class="star-1" cx="95" cy="34" r="1.4" fill="#fef3c7" />
    <circle class="star-2" cx="170" cy="58" r="1.1" fill="#fde68a" />
    <circle class="star-3" cx="255" cy="26" r="1.5" fill="#ffffff" />
    <circle class="star-1" cx="610" cy="30" r="1.3" fill="#fef3c7" />
    <circle class="star-2" cx="695" cy="52" r="1.5" fill="#ffffff" />
    <circle class="star-3" cx="765" cy="28" r="1.2" fill="#fde68a" />
    <circle class="star-2" cx="790" cy="76" r="1.0" fill="#fef3c7" />
    <circle class="star-1" cx="62" cy="74" r="1.1" fill="#ffffff" />

    <!-- Animated Setting Sun -->
    <g clip-path="url(#aboveHorizon)">
      <g class="sun-group">
        <circle class="halo" cx="425" cy="155" r="95" fill="url(#sunHalo)" />
        <circle cx="425" cy="155" r="36" fill="url(#sunGrad)" />
      </g>
    </g>

    <!-- Distant Mountain Ridge -->
    <path d="M0 168 L110 122 L225 152 L340 116 L430 148 L545 112 L670 146 L775 118 L850 144 L850 168 Z" fill="#1e1b2e" opacity="0.85" />

    <!-- Foreground Mountain Silhouette -->
    <path d="M0 168 L85 138 L180 160 L295 132 L385 162 L495 136 L605 158 L720 130 L850 156 L850 168 Z" fill="#0f111a" />

    <!-- Water / Horizon Reflection -->
    <rect x="0" y="168" width="850" height="52" fill="url(#waterGrad)" />
    <rect class="ripple-1" x="355" y="176" width="140" height="3" rx="1.5" fill="#fbbf24" />
    <rect class="ripple-2" x="378" y="186" width="94" height="2.5" rx="1.25" fill="#f97316" />
    <rect class="ripple-3" x="396" y="196" width="58" height="2" rx="1" fill="#ea580c" />
    <rect class="ripple-1" x="410" y="205" width="30" height="1.5" rx="0.75" fill="#fbbf24" opacity="0.6" />

    <!-- Big Profile Title -->
    <text x="425" y="96" text-anchor="middle" class="title-text">Haoxuan Li</text>
  </g>
</svg>
